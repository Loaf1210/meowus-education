<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Meowus Education</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./mindx-cinema/styles/auth.css">
</head>

<body class="auth-page">

    <!-- Only ONE <main>. No Bootstrap ".container" class: the card sets its own width. -->
    <main class="auth-container">

        <!-- CARD: form on the left, cat on the right (cat hidden on phones) -->
        <div class="auth-card">

            <section class="auth-form-panel">
                <a class="auth-brand" href="./login.html" aria-label="Meowus Education home">
                    <img class="auth-logo" src="./mindx-cinema/assets/icon.png" alt="Meowus Education">
                </a>

                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Log in to continue your studies and visit your cat collection.</p>

                <!-- novalidate: login.js does the checks and shows messages under each field -->
                <form id="login-form" novalidate>

                    <div class="auth-field">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" type="text" id="username" name="username"
                            placeholder="Your username" minlength="6" maxlength="18" autocomplete="username" required>
                        <small class="error-message" id="username-error" aria-live="polite"></small>
                    </div>

                    <div class="auth-field">
                        <label class="form-label" for="email">Email address</label>
                        <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com"
                            maxlength="254" autocomplete="email" required>
                        <small class="error-message" id="email-error" aria-live="polite"></small>
                    </div>

                    <div class="auth-field">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password"
                            placeholder="Your password" maxlength="64" autocomplete="current-password" required>
                        <small class="error-message" id="password-error" aria-live="polite"></small>
                    </div>

                    <button class="btn btn-danger w-100 auth-submit" id="login-submit" type="submit">
                        Log in
                    </button>

                    <!-- login.js writes "wrong details" and "registered" messages here -->
                    <p class="auth-status" id="form-status" role="status" aria-live="polite"></p>
                </form>

                <p class="auth-footer">
                    Don't have an account? <a href="./register.html">Create one</a>
                </p>
            </section>

            <aside class="auth-art-panel">
                <img src="./mindx-cinema/assets/cat.png" alt="Cat illustration">
            </aside>

        </div>
    </main>

    <!-- auth.js MUST load first: login.js uses window.MeowusAuth -->
    <script src="./mindx-cinema/scripts/auth.js"></script>
    <script src="./mindx-cinema/scripts/login.js"></script>
</body>

</html>
